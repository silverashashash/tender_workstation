<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 460" width="1120" height="460" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <filter id="sh3" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>
  <rect width="1120" height="460" rx="14" fill="#F8FAFC"/>
  <rect width="1120" height="40" rx="14" fill="#1E293B"/>
  <rect y="26" width="1120" height="14" fill="#1E293B"/>
  <circle cx="22" cy="20" r="5.5" fill="#EF4444"/><circle cx="40" cy="20" r="5.5" fill="#F59E0B"/><circle cx="58" cy="20" r="5.5" fill="#10B981"/>
  <text x="560" y="24" text-anchor="middle" fill="#CBD5E1" font-size="12" font-weight="500">系统操作 SOP 指南库（图文/MD/PDF）&amp; 离线实用工具箱</text>

  <!-- Left: SOP Guides Library -->
  <g transform="translate(24, 60)">
    <rect width="540" height="376" rx="12" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#sh3)"/>
    <rect width="540" height="44" rx="12" fill="#F8FAFC"/>
    <line x1="0" y1="44" x2="540" y2="44" stroke="#E2E8F0"/>
    <text x="16" y="27" fill="#1E293B" font-size="13" font-weight="700">开评标系统操作 SOP 指南库</text>
    <rect x="336" y="12" width="90" height="20" rx="5" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="381" y="25" text-anchor="middle" fill="#3B5B7E" font-size="10">导入 MD / PDF</text>
    <rect x="434" y="12" width="90" height="20" rx="5" fill="#3B5B7E"/>
    <text x="479" y="25" text-anchor="middle" fill="#FFFFFF" font-size="10">+ 新建图文 SOP</text>

    <!-- Catalog + Reader -->
    <line x1="184" y1="44" x2="184" y2="376" stroke="#E2E8F0"/>
    <g transform="translate(12, 58)" font-size="11">
      <rect width="160" height="52" rx="7" fill="#EBF2F7"/>
      <text x="10" y="21" fill="#1E293B" font-weight="600">内网开标解密步骤</text>
      <text x="10" y="39" fill="#3B5B7E" font-size="9.5">内网开标 · 图文 MD · 4 图</text>

      <rect y="60" width="160" height="52" rx="7" fill="#FFFFFF" stroke="#F1F5F9"/>
      <text x="10" y="81" fill="#334155" font-weight="500">多轮报价发起手册</text>
      <text x="10" y="99" fill="#A94442" font-size="9.5">评审过程 · PDF 在线翻阅</text>

      <rect y="120" width="160" height="52" rx="7" fill="#FFFFFF" stroke="#F1F5F9"/>
      <text x="10" y="141" fill="#334155" font-weight="500">评审结束导表清单</text>
      <text x="10" y="159" fill="#64748B" font-size="9.5">资料带出 · 图文 MD · 2 图</text>
    </g>

    <g transform="translate(198, 58)" font-size="11" fill="#334155">
      <text y="14" font-size="13" font-weight="700" fill="#1E293B">内网开标解密与导表操作步骤</text>
      <rect x="210" y="0" width="54" height="20" rx="4" fill="#FFFFFF" stroke="#CBD5E1"/>
      <text x="237" y="13" text-anchor="middle" font-size="9.5" fill="#475569">导出 MD</text>
      <rect x="270" y="0" width="58" height="20" rx="4" fill="#ECFDF5" stroke="#A7F3D0"/>
      <text x="299" y="13" text-anchor="middle" font-size="9.5" fill="#2F6F5E">导出 PDF</text>

      <line x1="0" y1="28" x2="328" y2="28" stroke="#F1F5F9"/>
      <text y="48" fill="#3B5B7E" font-weight="600">1. 插入 CA 证书并进入开标大厅</text>
      <text y="68" fill="#475569" font-size="10.5">支持 Markdown 排版、表格、代码块与 Ctrl+V 直接粘贴截图</text>
      <rect y="82" width="328" height="106" rx="8" fill="#F1F5F9" stroke="#E2E8F0"/>
      <text x="164" y="138" text-anchor="middle" fill="#64748B" font-size="11">[ 系统界面操作截图 · 点击可全屏放大 ]</text>
      <text y="212" fill="#3B5B7E" font-weight="600">2. 导出送达与密封情况表 + 行信息报价表</text>
      <text y="232" fill="#475569" font-size="10.5">全批次共享知识库，自动纳入整库备份，离线环境亦可完整查阅。</text>
      <text y="254" fill="#475569" font-size="10.5">支持上传 PDF 手册内嵌阅读，或将图文指南一键导出为 A4 PDF。</text>
    </g>
  </g>

  <!-- Right: Standalone Offline Toolbox (7 Tools) -->
  <g transform="translate(584, 60)">
    <rect width="512" height="376" rx="12" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#sh3)"/>
    <rect width="512" height="44" rx="12" fill="#F8FAFC"/>
    <line x1="0" y1="44" x2="512" y2="44" stroke="#E2E8F0"/>
    <text x="16" y="27" fill="#1E293B" font-size="13" font-weight="700">独立实用工具箱（7 款高频招投标效率工具）</text>

    <g transform="translate(16, 58)" font-size="11">
      <rect width="234" height="64" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="12" y="24" fill="#1E293B" font-weight="600">1. 多工作表合并</text>
      <text x="12" y="45" fill="#64748B" font-size="10">批量合并多份 Excel，自动对齐表头</text>

      <rect x="246" width="234" height="64" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="258" y="24" fill="#1E293B" font-weight="600">2. 单行数据展开与合并</text>
      <text x="258" y="45" fill="#64748B" font-size="10">两级拆分 / 分组汇总 / 联系人主键对齐</text>

      <rect y="76" width="234" height="64" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="12" y="100" fill="#1E293B" font-weight="600">3. Word 文字与数字批量处理</text>
      <text x="12" y="121" fill="#64748B" font-size="10">批量替换、倍率调整、删段与结构化提取</text>

      <rect x="246" y="76" width="234" height="64" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="258" y="100" fill="#1E293B" font-weight="600">4. 专家打分表按模板合并</text>
      <text x="258" y="121" fill="#64748B" font-size="10">冲突标黄、自动去筛选、脱离共享公式</text>

      <rect y="152" width="234" height="64" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="12" y="176" fill="#1E293B" font-weight="600">5. 履约分匹配填入</text>
      <text x="12" y="197" fill="#64748B" font-size="10">自动按供应商匹配履约分并回填模板</text>

      <rect x="246" y="152" width="234" height="64" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="258" y="176" fill="#1E293B" font-weight="600">6. 清单合规性检验</text>
      <text x="258" y="197" fill="#64748B" font-size="10">批量解压校验技术规范书及敏感词扫描</text>

      <rect y="228" width="480" height="64" rx="8" fill="#EBF2F7" stroke="#CBD5E1"/>
      <text x="14" y="252" fill="#3B5B7E" font-weight="700">7. 专家随机打分（测试演练专用）</text>
      <text x="14" y="273" fill="#475569" font-size="10.5">自动锁定标黄客观分列，智能生成满足「不过半同分 &amp; 分差不超阈」的多专家测试打分表</text>
    </g>
  </g>
</svg>
