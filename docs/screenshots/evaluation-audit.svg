<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <filter id="sh2" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>
  <rect width="1120" height="560" rx="14" fill="#F8FAFC"/>
  <rect width="1120" height="40" rx="14" fill="#1E293B"/>
  <rect y="26" width="1120" height="14" fill="#1E293B"/>
  <circle cx="22" cy="20" r="5.5" fill="#EF4444"/><circle cx="40" cy="20" r="5.5" fill="#F59E0B"/><circle cx="58" cy="20" r="5.5" fill="#10B981"/>
  <text x="560" y="24" text-anchor="middle" fill="#CBD5E1" font-size="12" font-weight="500">开评标模块 · 围串标风控核验 &amp; 专家打分预校验（演示脱敏数据）</text>

  <!-- Left Card: Collusion & Quote Audit -->
  <g transform="translate(24, 60)">
    <rect width="526" height="476" rx="12" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#sh2)"/>
    <rect width="526" height="44" rx="12" fill="#F8FAFC"/>
    <line x1="0" y1="44" x2="526" y2="44" stroke="#E2E8F0"/>
    <text x="18" y="27" fill="#1E293B" font-size="13.5" font-weight="700">报价税率合规 + 围串标风控核验</text>
    <rect x="424" y="12" width="84" height="20" rx="10" fill="#FEF2F2"/>
    <text x="466" y="25" text-anchor="middle" fill="#A94442" font-size="10.5" font-weight="600">5 项预警</text>

    <!-- Audit Pills -->
    <g transform="translate(18, 60)" font-size="11">
      <rect width="92" height="24" rx="6" fill="#A94442"/><text x="46" y="16" text-anchor="middle" fill="#FFFFFF">超限价 (2)</text>
      <rect x="100" width="96" height="24" rx="6" fill="#F1F5F9"/><text x="148" y="16" text-anchor="middle" fill="#475569">报价过低 (1)</text>
      <rect x="204" width="108" height="24" rx="6" fill="#F1F5F9"/><text x="258" y="16" text-anchor="middle" fill="#475569">联系信息重合 (1)</text>
      <rect x="320" width="114" height="24" rx="6" fill="#F1F5F9"/><text x="377" y="16" text-anchor="middle" fill="#475569">硬件特征一致 (1)</text>
    </g>

    <!-- Risk Cards -->
    <g transform="translate(18, 102)" font-size="11">
      <rect width="490" height="78" rx="8" fill="#FEF2F2" stroke="#FECACA"/>
      <text x="14" y="22" fill="#A94442" font-weight="700">[硬件特征围串标预警] CPU + 硬盘 + MAC 三项一致</text>
      <text x="14" y="42" fill="#334155">标包：数字化服务-包2 · 涉及：示例科技公司 A / 示例信息公司 B</text>
      <text x="14" y="61" fill="#64748B" font-size="10">跨类别跨轮次精确比对（自动剔除占位符，支持一键生成《预警事项确认单.docx》）</text>

      <rect y="92" width="490" height="78" rx="8" fill="#FEF9EC" stroke="#FDE68A"/>
      <text x="14" y="114" fill="#9A6B26" font-weight="700">[同标包联系信息重合] 联系人手机 / 邮箱相同</text>
      <text x="14" y="134" fill="#334155">标包：勘察设计-包1 · 重合字段：手机号码（138****0001）</text>
      <text x="14" y="153" fill="#64748B" font-size="10">严格限定同分标+同包核验，自动规范化电话与邮箱格式并过滤占位词</text>

      <rect y="184" width="490" height="78" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="14" y="206" fill="#3B5B7E" font-weight="700">[报价与税率核验] 合并子包独立限价 + 低于成本三规则</text>
      <text x="14" y="226" fill="#334155">自动核验：超限价 / 二轮超一轮 / 相同报价 / 税率异常 / 证明待核实</text>
      <text x="14" y="245" fill="#64748B" font-size="10">支持服务类 (0/1/3/5/6/9/13%) 与物资类 (13%) 独立口径一键导出 .xlsx</text>

      <rect y="276" width="490" height="80" rx="8" fill="#ECFDF5" stroke="#A7F3D0"/>
      <text x="14" y="298" fill="#2F6F5E" font-weight="700">现场工具链全覆盖（零公式误差 BigInt 十进制引擎）</text>
      <text x="14" y="318" fill="#334155">价格分计算 · 履约分生成 · 经济排序核验 · 授标分配 · 智能分包</text>
      <text x="14" y="337" fill="#64748B" font-size="10">全部原生 TypeScript 运行于本地，无需外网、无需 Python 运行环境</text>
    </g>
  </g>

  <!-- Right Card: Expert Score Precheck -->
  <g transform="translate(570, 60)">
    <rect width="526" height="476" rx="12" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#sh2)"/>
    <rect width="526" height="44" rx="12" fill="#F8FAFC"/>
    <line x1="0" y1="44" x2="526" y2="44" stroke="#E2E8F0"/>
    <text x="18" y="27" fill="#1E293B" font-size="13.5" font-weight="700">专家打分预校验（线下上传前自动体检）</text>
    <rect x="404" y="12" width="104" height="20" rx="5" fill="#2F6F5E"/>
    <text x="456" y="25" text-anchor="middle" fill="#FFFFFF" font-size="10">导出预校验报告</text>

    <!-- Multi-level header table preview -->
    <g transform="translate(18, 58)">
      <text x="0" y="14" fill="#475569" font-size="11" font-weight="600">客观分核验项配置 · 自动识别一/二级表头与标黄客观列</text>
      <rect y="24" width="490" height="218" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
      <rect y="24" width="490" height="28" rx="8" fill="#F8FAFC"/>
      <line x1="0" y1="52" x2="490" y2="52" stroke="#E2E8F0"/>
      <g font-size="10.5" fill="#64748B" font-weight="600">
        <text x="12" y="42">列</text>
        <text x="46" y="42">一级要素</text>
        <text x="178" y="42">二级要素 / 评分细则</text>
        <text x="348" y="42">分值 / 极差</text>
        <text x="438" y="42">标色</text>
      </g>

      <g transform="translate(0, 52)" font-size="10.5" fill="#334155">
        <rect width="490" height="36" fill="#EBF2F7" opacity="0.45"/>
        <text x="12" y="22" font-family="monospace">G</text>
        <text x="46" y="22" font-weight="600">1.诚信评价 (0分)</text>
        <text x="178" y="22">不良行为处理情况通报 (-30~0分)</text>
        <text x="348" y="22" fill="#64748B">0~30 · 极差15</text>
        <rect x="434" y="10" width="40" height="17" rx="4" fill="#FEF9EC" stroke="#F59E0B"/>
        <text x="454" y="22" text-anchor="middle" fill="#9A6B26" font-size="9.5">标黄</text>

        <line x1="0" y1="36" x2="490" y2="36" stroke="#F1F5F9"/>
        <rect y="36" width="490" height="36" fill="#EBF2F7" opacity="0.45"/>
        <text x="12" y="58" font-family="monospace">J</text>
        <text x="46" y="58" font-weight="600">2.绿色低碳 (3分)</text>
        <text x="178" y="58">绿电绿证 (0~3分)</text>
        <text x="348" y="58" fill="#64748B">0~3 · 极差3</text>
        <rect x="434" y="46" width="40" height="17" rx="4" fill="#FEF9EC" stroke="#F59E0B"/>
        <text x="454" y="58" text-anchor="middle" fill="#9A6B26" font-size="9.5">标黄</text>

        <line x1="0" y1="72" x2="490" y2="72" stroke="#F1F5F9"/>
        <rect y="72" width="490" height="36" fill="#EBF2F7" opacity="0.45"/>
        <text x="12" y="94" font-family="monospace">K</text>
        <text x="46" y="94" font-weight="600">3.科研创新 (7分)</text>
        <text x="178" y="94">企业创新成果 (0~1分)</text>
        <text x="348" y="94" fill="#64748B">0~1 · 极差0.1</text>
        <rect x="434" y="82" width="40" height="17" rx="4" fill="#FEF9EC" stroke="#F59E0B"/>
        <text x="454" y="94" text-anchor="middle" fill="#9A6B26" font-size="9.5">标黄</text>

        <line x1="0" y1="108" x2="490" y2="108" stroke="#F1F5F9"/>
        <text x="12" y="130" font-family="monospace">O</text>
        <text x="46" y="130" font-weight="600">4.综合评价 (90分)</text>
        <text x="178" y="130">综合实力 (26~36分)</text>
        <text x="348" y="130" fill="#64748B">26~36 · 极差1</text>
        <text x="454" y="130" text-anchor="middle" fill="#94A3B8" font-size="9.5">主观项</text>

        <line x1="0" y1="144" x2="490" y2="144" stroke="#F1F5F9"/>
        <text x="12" y="166" font-family="monospace">P</text>
        <text x="46" y="166" font-weight="600">4.综合评价 (90分)</text>
        <text x="178" y="166">投标响应 (41~54分)</text>
        <text x="348" y="166" fill="#64748B">41~54 · 极差1</text>
        <text x="454" y="166" text-anchor="middle" fill="#94A3B8" font-size="9.5">主观项</text>
      </g>

      <!-- Precheck Highlights -->
      <g transform="translate(0, 260)" font-size="11" fill="#334155">
        <rect width="490" height="142" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
        <text x="14" y="24" fill="#3B5B7E" font-weight="700">核心预校验规则（与线上结果校验 1:1 同口径）</text>
        <text x="14" y="48">• 自动排除初评已否决供应商（命中《未进入详评统计表》标段+包号+应答人）</text>
        <text x="14" y="70">• 精确核验总分「超半数同分」与「任意两名专家分差严格大于阈值」</text>
        <text x="14" y="92">• 兼容扣分项负数（如 -15）、空白格按 0 分提醒、多表头左向继承</text>
        <text x="14" y="114">• 已上传专家表支持随时追加、单个/批量删除并按当前参数一键重算</text>
      </g>
    </g>
  </g>
</svg>
